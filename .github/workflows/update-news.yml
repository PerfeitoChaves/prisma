name: Atualização Contínua do PRISMA

on:
  schedule:
    # Fallback a cada 30 min; o Worker dispara antes quando há notícia nova
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite acionar manualmente a qualquer momento pelo botão "Run workflow"

permissions:
  contents: read

concurrency:
  group: prisma-cron-update
  cancel-in-progress: false

jobs:
  update-news:
    name: Coleta, Síntese e Envio ao D1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Executar Coleta Multi-Fonte, Agrupamento e Síntese de Notícias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PRISMA_INGEST_TOKEN: ${{ secrets.PRISMA_INGEST_TOKEN }}
        run: |
          python3 scripts/update_and_publish.py
