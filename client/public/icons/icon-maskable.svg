<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#171410"/>
  
  <!-- Safe zone scaled Prism Emblem -->
  <g transform="translate(118, 140) scale(3.8)">
    <!-- incoming beam -->
    <line x1="0" y1="28" x2="18" y2="28" stroke="#F6F2EA" stroke-width="3.5" stroke-linecap="round"/>
    <!-- prism triangle -->
    <path d="M30 6 L48 44 L12 44 Z" fill="#F6F2EA" fill-opacity="0.18" stroke="#F6F2EA" stroke-width="3" stroke-linejoin="round"/>
    <!-- dispersed spectrum beams -->
    <line x1="38" y1="26" x2="71" y2="10" stroke="#C1272D" stroke-width="4" stroke-linecap="round"/>
    <line x1="39" y1="30" x2="71" y2="26" stroke="#E9B44C" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="34" x2="71" y2="42" stroke="#2B50AA" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography inside safe zone -->
  <text x="256" y="385" font-family="serif" font-size="44" font-weight="900" letter-spacing="6" fill="#F6F2EA" text-anchor="middle">PRISMA</text>
  <text x="256" y="415" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#8E887C" text-anchor="middle">TODOS OS ÂNGULOS</text>
</svg>
