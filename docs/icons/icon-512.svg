<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#171410"/>
  <!-- Decorative border -->
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="#2f2b25" stroke-width="4"/>
  
  <!-- Prism Emblem scaled -->
  <g transform="translate(76, 110) scale(5.0)">
    <!-- incoming beam -->
    <line x1="0" y1="28" x2="18" y2="28" stroke="#F6F2EA" stroke-width="3.5" stroke-linecap="round"/>
    <!-- prism triangle -->
    <path d="M30 6 L48 44 L12 44 Z" fill="#F6F2EA" fill-opacity="0.18" stroke="#F6F2EA" stroke-width="3" stroke-linejoin="round"/>
    <!-- dispersed spectrum beams -->
    <line x1="38" y1="26" x2="71" y2="10" stroke="#C1272D" stroke-width="4" stroke-linecap="round"/>
    <line x1="39" y1="30" x2="71" y2="26" stroke="#E9B44C" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="34" x2="71" y2="42" stroke="#2B50AA" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="256" y="420" font-family="serif" font-size="52" font-weight="900" letter-spacing="8" fill="#F6F2EA" text-anchor="middle">PRISMA</text>
  <text x="256" y="454" font-family="sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#8E887C" text-anchor="middle">TODOS OS ÂNGULOS</text>
</svg>
